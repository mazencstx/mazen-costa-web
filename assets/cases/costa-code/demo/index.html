<!doctype html>
<html lang="en" data-theme="dark" data-motion="full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Costa Code: AI Software Engineer</title>
<link rel="icon" href="./assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<video class="hero-video" id="heroVideo" src="./media/hero.mp4" autoplay muted loop playsinline preload="metadata"></video>
<div class="hero-overlay" aria-hidden="true"></div>

<button class="menu-toggle" id="menuToggle" type="button" aria-label="Menu"></button>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="view" id="view"></div>
    <div class="composer-wrap" id="composerWrap" hidden></div>
  </main>
</div>

<!-- Settings overlay -->
<div class="overlay" id="settingsOverlay">
  <div class="overlay-backdrop" data-close-settings></div>
  <div class="settings-shell">
    <nav class="settings-nav" id="settingsNav"></nav>
    <div class="settings-panel" id="settingsPanel"></div>
  </div>
</div>

<!-- Site Editor overlay -->
<div class="overlay" id="editorOverlay">
  <div class="overlay-backdrop" data-close-editor></div>
  <div class="settings-shell settings-shell--wide">
    <div class="settings-panel" id="editorPanel"></div>
  </div>
</div>

<!-- Generic modal -->
<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="modal" id="modal"></div>

<script src="./demo-data.js"></script>
<script src="./demo-mode.js"></script>
<script src="./mascot.js"></script>
<script src="./icons.js"></script>
<script src="./store.js"></script>
<script src="./content.js"></script>
<script src="./views/sidebar.js"></script>
<script src="./views/panels.js"></script>
<script src="./views/home.js"></script>
<script src="./views/chat.js"></script>
<script src="./views/prompts.js"></script>
<script src="./views/settings.js"></script>
<script src="./views/editor.js"></script>
<script src="./app.js"></script>
</body>
</html>
