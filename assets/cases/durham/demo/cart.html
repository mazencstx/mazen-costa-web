<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — DURHAM</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="../logo.jpeg">
  <script src="./demo-data.js"></script>
  <script src="./demo-mode.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="wrap">
      <div class="nav-left">
        <a class="nav-link" href="./shop.html">Shop</a>
        <a class="nav-link" href="./about.html">About</a>
      </div>
      <a class="logo" href="./index.html">DURHAM</a>
      <div class="nav-right">
        <button class="nav-icon-btn" data-search-toggle>Search</button>
        <a class="nav-icon-btn" href="./cart.html">Cart (<span data-cart-count>0</span>)</a>
      </div>
    </div>
    <div class="search-panel" data-search-panel>
      <div class="wrap">
        <form>
          <input class="search-input" type="text" placeholder="Search products…" />
        </form>
      </div>
    </div>
  </nav>

  <section class="cart-page">
    <div class="wrap">
      <h1 class="cart-title">Your Cart</h1>

      <div class="cart-layout">
        <div>
          <div data-cart-list></div>
          <div class="cart-empty" data-cart-empty style="display:none">Your cart is empty</div>
        </div>

        <div class="cart-summary" data-cart-summary>
          <h2>Order Summary</h2>
          <div class="summary-row summary-total">
            <span>Total</span>
            <span data-cart-total>EGP 0</span>
          </div>

          <form class="checkout-form" data-order-form>
            <input type="text" name="name" placeholder="Full Name" required />
            <input type="tel" name="phone" placeholder="Phone Number" required />
            <input type="text" name="address" placeholder="Delivery Address" required />
            <textarea name="notes" placeholder="Notes (optional)"></textarea>
            <div class="form-error" data-form-error></div>
            <button type="submit" class="btn btn-primary btn-full">Place Order</button>
          </form>

          <div class="add-to-cart-msg" data-order-confirmation style="display:none">
            Order placed — confirm via WhatsApp
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div class="footer-top">
        <div class="footer-logo">DURHAM</div>
        <div class="footer-links">
          <a href="./shop.html">Shop</a>
          <a href="./about.html">About</a>
          <a href="./cart.html">Cart</a>
        </div>
      </div>
      <div class="footer-copy">© 2026 DURHAM. Egypt.</div>
    </div>
  </footer>

  <script src="./js/cart.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/cart-page.js"></script>
</body>
</html>
